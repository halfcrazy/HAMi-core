---
name: build-src

on: [push, pull_request, workflow_dispatch]

concurrency: ci-${{ github.ref }}

jobs:
  cuda-header-matrix-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: CUDA header matrix check
    strategy:
      fail-fast: false
      matrix:
        cuda: ["12.2.0", "12.4.1", "12.6.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Run CUDA header matrix checker
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu22.04" \
            bash -lc '
              apt-get update &&
              apt-get install -y --no-install-recommends python3 &&
              python3 hack/check_cuda_header_matrix.py \
                --cuda-version "${{ matrix.cuda }}" \
                --include-dir /usr/local/cuda/include
            '

  BuildHamiCoreLib:
    needs: [cuda-header-matrix-check]
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    strategy:
      fail-fast: true
    name: Build libvgpu
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v1
      - name: Build
        run: |
          #git config --global --add safe.directory "$GITHUB_WORKSPACE"
          #git config --global --add safe.directory $WORKDIR
          echo "hello world"
          make build-in-docker
